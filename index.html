<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reward the Pack</title>
  </head>
  <body>
    <main id="app">
      <h1>Reward the Pack</h1>
      <p class="tagline">Good Dog Daycare. You own it. The GM runs it. You write the bonus plan.</p>

      <div class="round-bar">
        <label for="round">Round</label>
        <select id="round">
          <option value="round1">Round 1: profit only</option>
          <option value="round2">Round 2: up to three measures</option>
          <option value="round3">Round 3: all six measures</option>
        </select>
        <p id="round-note" class="round-note"></p>
      </div>

      <section id="editor" aria-labelledby="editor-title">
        <h2 id="editor-title">The GM's bonus plan</h2>
      </section>

      <div class="compare">
        <div class="compare-side">
          <label class="compare-label" for="prediction">Your team's prediction (write it before you put the GM to work)</label>
          <textarea
            id="prediction"
            rows="2"
            placeholder="What will the GM do with this bonus plan? How many dogs, how many staff on the floor, how many incidents?"
          ></textarea>
        </div>
        <div class="compare-side">
          <p class="compare-label readout-label" id="readout-label">A week the GM's way</p>
          <p id="readout" aria-live="polite"></p>
        </div>
      </div>

      <div class="controls">
        <label for="seed">Seed</label>
        <input id="seed" type="number" min="0" max="4294967295" step="1" value="1" inputmode="numeric" />
        <button id="train" type="button">Put the GM to work</button>
        <label class="fast"><input id="fast" type="checkbox" /> Fast (no pacing)</label>
      </div>

      <section id="watch" aria-label="Watch the GM at work">
        <p id="status">Write your prediction, then put the GM to work.</p>
        <div class="watch-row">
          <figure class="curve-figure">
            <canvas id="curve" width="1100" height="619" aria-label="The GM's weekly bonus as it learns the job"></canvas>
            <figcaption id="curve-caption">
              You wrote the bonus plan. Watch the GM's bonus climb as it learns how to earn it.
              Each dot is a week run its current way, nothing new tried.
            </figcaption>
          </figure>
          <figure class="replay-figure">
            <canvas id="replay" width="640" height="540" data-week="none" aria-label="A week the GM's way, played block by block"></canvas>
            <figcaption id="replay-caption">A week the GM's way</figcaption>
            <button id="replay-again" type="button" hidden>Watch the week again</button>
          </figure>
        </div>
      </section>

      <section id="report" aria-labelledby="report-title" hidden>
        <h2 id="report-title">The weekly P&amp;L and operations report</h2>
        <table id="report-table"></table>
      </section>

      <section id="pilot"></section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
